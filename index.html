<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portofolio | Sedang Pemeliharaan</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        gray: {
                            850: '#1f2937',
                            900: '#111827',
                            950: '#030712',
                        },
                        terminal: {
                            green: '#10b981',
                            blue: '#3b82f6',
                            yellow: '#eab308',
                            red: '#ef4444'
                        }
                    },
                    animation: {
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #030712;
            background-image:
                radial-gradient(at 0% 0%, rgba(17, 24, 39, 1) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(30, 58, 138, 0.15) 0px, transparent 50%);
            background-attachment: fixed;
        }

        /* Custom Scrollbar for Terminal */
        .terminal-scroll::-webkit-scrollbar {
            width: 6px;
        }
        .terminal-scroll::-webkit-scrollbar-track {
            background: rgba(17, 24, 39, 0.5);
            border-radius: 4px;
        }
        .terminal-scroll::-webkit-scrollbar-thumb {
            background: rgba(75, 85, 99, 0.8);
            border-radius: 4px;
        }
        .terminal-scroll::-webkit-scrollbar-thumb:hover {
            background: rgba(107, 114, 128, 1);
        }

        .cursor-blink {
            animation: blink 1s step-end infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .fade-in {
            animation: fadeIn 0.5s ease-in-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (prefers-reduced-motion: reduce) {
            .cursor-blink,
            .fade-in,
            .animate-ping {
                animation: none !important;
            }
        }
    </style>
</head>
<body class="text-gray-300 min-h-screen flex flex-col justify-center items-center p-4 sm:p-8">

    <div class="max-w-3xl w-full flex flex-col gap-8">

        <!-- Header Section -->
        <div class="text-center space-y-4">
            <div class="inline-flex items-center justify-center p-3 bg-gray-800/50 rounded-full border border-gray-700/50 mb-4 ring-1 ring-white/10 shadow-lg" aria-hidden="true">
                <svg class="w-8 h-8 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                </svg>
            </div>

            <h1 class="text-4xl md:text-5xl font-bold text-white tracking-tight">
                Sedang Dalam <span class="text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-emerald-400">Perbaikan</span>
            </h1>

            <p class="text-lg md:text-xl text-gray-400 max-w-2xl mx-auto leading-relaxed">
                Website portofolio saya sedang dalam tahap pemeliharaan dan peningkatan sistem untuk menghadirkan proyek dan antarmuka terbaru. Saya akan segera kembali!
            </p>
        </div>

        <!-- Terminal / Live Process Element -->
        <div class="w-full bg-gray-950 rounded-xl border border-gray-800 shadow-2xl overflow-hidden mt-6">

            <!-- Terminal Header -->
            <div class="bg-gray-900 border-b border-gray-800 px-4 py-3 flex items-center justify-between">
                <div class="flex space-x-2" aria-hidden="true">
                    <div class="w-3 h-3 rounded-full bg-red-500/80"></div>
                    <div class="w-3 h-3 rounded-full bg-yellow-500/80"></div>
                    <div class="w-3 h-3 rounded-full bg-green-500/80"></div>
                </div>
                <div class="text-xs font-mono text-gray-500 font-medium tracking-wider flex items-center gap-2">
                    <span class="relative flex h-2 w-2" aria-hidden="true">
                      <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
                      <span class="relative inline-flex rounded-full h-2 w-2 bg-green-500"></span>
                    </span>
                    LIVE PROCESS
                </div>
                <div class="w-12"></div> <!-- Spacer for centering -->
            </div>

            <!-- Terminal Body -->
            <div id="terminal-body" role="log" aria-live="polite" aria-label="Log proses pemeliharaan" class="p-5 font-mono text-sm md:text-base h-64 overflow-y-auto terminal-scroll flex flex-col gap-1">
                <!-- Logs will be injected here via JS -->
            </div>
        </div>

        <!-- Footer / Contact -->
        <div class="mt-8 text-center border-t border-gray-800/50 pt-8">
            <p class="text-sm text-gray-500 mb-4">
                Punya keperluan mendesak? Silakan hubungi saya melalui:
            </p>
            <div class="flex flex-wrap justify-center gap-4">
                <a href="mailto:diaskurnia01@gmail.com" class="px-5 py-2.5 rounded-lg bg-gray-800 text-gray-300 hover:bg-gray-700 hover:text-white transition-colors border border-gray-700 flex items-center gap-2 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 focus:ring-offset-gray-950">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
                    Email
                </a>
                <a href="https://www.linkedin.com/in/diasputrakurniasandi/" target="_blank" rel="noopener noreferrer" class="px-5 py-2.5 rounded-lg bg-blue-600/10 text-blue-400 hover:bg-blue-600/20 transition-colors border border-blue-900/50 flex items-center gap-2 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 focus:ring-offset-gray-950">
                    <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path fill-rule="evenodd" d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z" clip-rule="evenodd"></path></svg>
                    LinkedIn
                </a>
            </div>
        </div>
    </div>

    <script>
        const terminalBody = document.getElementById('terminal-body');
        const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        // Log sequences to simulate portfolio rebuilding
        const logSequences = [
            { text: "[SISTEM] Menginisialisasi pembaruan portofolio v3.0...", type: "info", delay: 1000 },
            { text: "[PROSES] Menghubungkan ke database repositori...", type: "process", delay: 800 },
            { text: "[SUKSES] Koneksi stabil. Latensi: 24ms.", type: "success", delay: 500 },
            { text: "[PROSES] Mengunduh aset terbaru (gambar, ikon, model 3D)...", type: "process", delay: 1500 },
            { text: "   --> aset_profil.webp [100%]", type: "detail", delay: 300 },
            { text: "   --> proyek_thumbnail_1.png [100%]", type: "detail", delay: 400 },
            { text: "   --> proyek_thumbnail_2.png [100%]", type: "detail", delay: 300 },
            { text: "[SUKSES] 42 aset berhasil diunduh.", type: "success", delay: 600 },
            { text: "[PROSES] Mengkompilasi gaya Tailwind CSS...", type: "process", delay: 1200 },
            { text: "[INFO] Membangun ulang komponen UI React/Next.js...", type: "info", delay: 2000 },
            { text: "[PERINGATAN] Cache sebelumnya kedaluwarsa. Membuat cache baru...", type: "warning", delay: 1000 },
            { text: "[PROSES] Mengoptimalkan ukuran bundel JavaScript...", type: "process", delay: 1800 },
            { text: "[SUKSES] Ukuran bundel berkurang 45% (2.4MB -> 1.3MB)", type: "success", delay: 800 },
            { text: "[PROSES] Menjalankan pengujian responsivitas otomatis...", type: "process", delay: 1500 },
            { text: "   --> Uji Mobile (320px) : LULUS", type: "detail", delay: 400 },
            { text: "   --> Uji Tablet (768px) : LULUS", type: "detail", delay: 400 },
            { text: "   --> Uji Desktop (1440px) : LULUS", type: "detail", delay: 500 },
            { text: "[SUKSES] Semua pengujian UI berhasil dilewati.", type: "success", delay: 800 },
            { text: "[PROSES] Mempersiapkan lingkungan produksi (Deployment)...", type: "process", delay: 2500 },
            { text: "[SISTEM] Status: Menunggu finalisasi.", type: "info", delay: 3000 },
            { text: "[INFO] Memulai ulang siklus pemantauan...", type: "info", delay: 1500 },
            { text: "--------------------------------------------------", type: "detail", delay: 500 }
        ];

        let currentLogIndex = 0;

        // Colors based on log type
        const colors = {
            info: 'text-blue-400',
            process: 'text-gray-300',
            success: 'text-terminal-green',
            warning: 'text-terminal-yellow',
            error: 'text-terminal-red',
            detail: 'text-gray-500'
        };

        // Create a new div line in terminal
        function createLineElement(colorClass) {
            const line = document.createElement('div');
            line.className = `fade-in ${colorClass} break-words`;
            return line;
        }

        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        // Typewriter effect function
        async function typeWriter(text, element, speed = 20) {
            if (prefersReducedMotion) {
                element.textContent = text;
                terminalBody.scrollTop = terminalBody.scrollHeight;
                return;
            }

            return new Promise(resolve => {
                let i = 0;
                element.innerHTML = '<span class="typing-text"></span><span class="cursor-blink bg-gray-400 w-2 h-4 inline-block ml-1 align-middle" aria-hidden="true"></span>';
                const textSpan = element.querySelector('.typing-text');
                const cursor = element.querySelector('.cursor-blink');

                function type() {
                    if (i < text.length) {
                        textSpan.textContent += text.charAt(i);
                        i++;
                        terminalBody.scrollTop = terminalBody.scrollHeight; // auto scroll
                        setTimeout(type, speed);
                    } else {
                        // Remove cursor when done
                        if (cursor) cursor.remove();
                        resolve();
                    }
                }
                type();
            });
        }

        // Main logging loop
        async function runLogs() {
            while (true) {
                const log = logSequences[currentLogIndex];

                // create new line
                const lineColor = colors[log.type] || colors.process;
                const activeLine = createLineElement(lineColor);
                terminalBody.appendChild(activeLine);

                // simulate typing
                await typeWriter(log.text, activeLine, Math.floor(Math.random() * 20) + 10); // Random typing speed between 10-30ms

                // wait based on delay defined in sequence
                await sleep(log.delay);

                // Move to next log, loop back if at end
                currentLogIndex++;
                if (currentLogIndex >= logSequences.length) {
                    currentLogIndex = 0;

                    // Add clearing effect before restart
                    const clearLine = createLineElement('text-gray-500 italic');
                    terminalBody.appendChild(clearLine);
                    await typeWriter("Membersihkan riwayat terminal untuk putaran berikutnya...", clearLine, 20);
                    await sleep(1000);

                    terminalBody.innerHTML = ''; // Clear terminal
                }
            }
        }

        // Start animation when window loads
        window.addEventListener('load', runLogs);
    </script>
</body>
</html>
